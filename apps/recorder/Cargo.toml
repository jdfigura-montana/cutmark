[package]
name = "cutmark-recorder"
description = "Cutmark Recorder: screen, webcam and audio recorder for the Cutmark suite."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "cutmark-recorder"
path = "src/main.rs"

# Strict lint set, same as crates/cutmark-hotkeys: unsafe_code is "deny" so a later scoped allow is possible.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[dependencies]
anyhow = "1.0.104"
capture = { version = "0.1.0", path = "../../crates/capture" }
chrono = { workspace = true, features = ["clock"] }
cutmark-hotkeys = { version = "0.1.0", path = "../../crates/cutmark-hotkeys" }
directories = "6.0.0"
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
egui.workspace = true
env_logger = "0.11.11"
global-hotkey = "0.10.0"
hound = { workspace = true }
log.workspace = true
marks = { version = "0.1.0", path = "../../crates/marks" }
media-io = { version = "0.1.0", path = "../../crates/media-io" }
raw-window-handle = "0.6"
rubato = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tray-icon = "0.26.1"
tungstenite.workspace = true
ui-kit = { version = "0.1.0", path = "../../crates/ui-kit" }
uuid.workspace = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
ffmpeg-next = { workspace = true }
