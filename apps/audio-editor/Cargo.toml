[package]
name = "cutmark-audio"
version = "1.1.0"
description = "CutMark Audio Editor"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.2"
assert_no_alloc = { version = "1.1.2", features = ["warn_debug"] }
chrono = { workspace = true, features = ["clock"] }
cpal = "0.18.2"
crossbeam-channel = "0.5.17"
directories = "6.0.0"
eframe = { workspace = true, features = ["default_fonts", "glow", "accesskit"] }
egui-phosphor = { version = "0.14.0", features = ["fill"] }
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format"] }
hound = "3.5.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
mp3lame-encoder = "0.2.5"
rfd = { workspace = true }
rtrb = "0.4.1"
rubato = "5.0.1"
serde = { workspace = true }
serde_json = { workspace = true }
symphonia = { version = "0.6.1", default-features = false, features = ["wav", "mp3", "pcm", "id3v2"] }
thiserror = { workspace = true }
trash = "5.2.9"
uuid = { workspace = true }

[dev-dependencies]
filetime = "0.2.29"
tempfile = "3.27.0"

[build-dependencies]
winresource = "0.1.34"


