[package]
name = "cutmark-audio"
version = "1.2.0"
description = "CutMark Audio Editor"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.2"
assert_no_alloc = { version = "1.1.2", features = ["warn_debug"] }
chrono = { workspace = true, features = ["clock"] }
cpal = "0.18.2"
crossbeam-channel = "0.5.17"
directories = "6.0.0"
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
egui-phosphor = { workspace = true }
ffmpeg-next = { workspace = true, features = ["codec", "format"] }
hound = { workspace = true }
rfd = { workspace = true }
rtrb = "0.4.1"
rubato = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
symphonia = { version = "0.6.1", default-features = false, features = ["wav", "mp3", "pcm", "id3v2"] }
thiserror = { workspace = true }
trash = "5.2.9"
ui-kit = { version = "0.1.0", path = "../../crates/ui-kit" }
uuid = { workspace = true }

[dev-dependencies]
egui_kittest.workspace = true
filetime = "0.2.29"
tempfile = "3.27.0"

[build-dependencies]
winresource = "0.1.34"


