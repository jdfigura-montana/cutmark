[graph]
targets = ["x86_64-pc-windows-msvc"]

[advisories]
version = 2
yanked = "deny"
ignore = [
  # chrono is flagged unmaintained (informational, not a vulnerability; no fixed version exists).
  # The pinned FilmCraft engine depends on it and we never edit that code, and the audio editor,
  # marks and recorder use it too. Review when FilmCraft moves off chrono, or when our own crates
  # move to jiff or time (tracked in the S0 spec's deferred list).
  { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; required by the pinned FilmCraft engine" },
  # RUSTSEC-2026-0192: ttf-parser is flagged unmaintained (informational; no safe upgrade).
  { id = "RUSTSEC-2026-0192", reason = "Pulled in by ab_glyph via egui/epaint and studio-render; only parses fonts bundled with the app; no maintained drop-in yet. Revisit when egui moves off ab_glyph." },
]

# Any ignore needs a comment with the advisory id and the reason.

[licenses]
version = 2
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "CC0-1.0", "0BSD", "Unlicense", "BSL-1.0", "MPL-2.0", "WTFPL",
  "BSD-1-Clause",   # assert_no_alloc; permissive
]
confidence-threshold = 0.9
exceptions = [
  # egui's bundled fonts. Confirm the crate name and licenses on the first run.
  { crate = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
]

[licenses.private]
ignore = true   # our own crates carry LicenseRef-Cutmark-Proprietary

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# LAME is LGPL and must never be linked statically. MP3 goes through the FFmpeg DLLs.
deny = ["mp3lame-sys", "mp3lame-encoder"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
  "https://github.com/jdfigura-montana/filmcraft",
  "https://github.com/storytold/craft-libs",
]
