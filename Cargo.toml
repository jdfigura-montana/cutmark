[package]
name = "audio_editor"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.2"
crossbeam-channel = "0.5.17"
directories = "6.0.0"
eframe = "0.36.2"
hound = "3.5.1"
rfd = "0.17.2"
rubato = "5.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", features = ["wav", "mp3", "pcm"] }
thiserror = "2.0.21"
uuid = { version = "1.28.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
