[package]
name = "audio_editor"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.2"
assert_no_alloc = { version = "1.1.2", features = ["warn_debug"] }
chrono = { version = "0.4.45", features = ["clock"] }
cpal = "0.18.2"
crossbeam-channel = "0.5.17"
directories = "6.0.0"
eframe = "0.36.2"
egui-phosphor = { version = "0.14.0", features = ["fill"] }
hound = "3.5.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
mp3lame-encoder = "0.2.5"
rfd = "0.17.2"
rubato = "5.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", features = ["wav", "mp3", "pcm"] }
thiserror = "2.0.21"
trash = "5.2.9"
uuid = { version = "1.28.0", features = ["v4", "serde"] }

[dev-dependencies]
filetime = "0.2.29"
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[build-dependencies]
winresource = "0.1.34"

