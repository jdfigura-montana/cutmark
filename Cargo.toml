[workspace]
resolver = "3"
members = ["apps/*", "crates/*"]
exclude = ["filmcraft", "patches/alsa-sys"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "LicenseRef-Cutmark-Proprietary"

[workspace.dependencies]
# FilmCraft engine, pinned. Read-only upstream: never edited here. Names kept so engine imports
# do not change.
filmcraft-time = { git = "https://github.com/jdfigura-montana/filmcraft", rev = "a9429d82d2e5b87539eb38926d5fc0f2ddcd7724" }
filmcraft-geom = { git = "https://github.com/jdfigura-montana/filmcraft", rev = "a9429d82d2e5b87539eb38926d5fc0f2ddcd7724" }
filmcraft-color = { git = "https://github.com/jdfigura-montana/filmcraft", rev = "a9429d82d2e5b87539eb38926d5fc0f2ddcd7724" }
filmcraft-frame = { git = "https://github.com/jdfigura-montana/filmcraft", rev = "a9429d82d2e5b87539eb38926d5fc0f2ddcd7724" }
filmcraft-media = { git = "https://github.com/jdfigura-montana/filmcraft", rev = "a9429d82d2e5b87539eb38926d5fc0f2ddcd7724" }
filmcraft-project = { git = "https://github.com/jdfigura-montana/filmcraft", rev = "a9429d82d2e5b87539eb38926d5fc0f2ddcd7724" }
filmcraft-edit = { git = "https://github.com/jdfigura-montana/filmcraft", rev = "a9429d82d2e5b87539eb38926d5fc0f2ddcd7724" }
filmcraft-text = { git = "https://github.com/jdfigura-montana/filmcraft", rev = "a9429d82d2e5b87539eb38926d5fc0f2ddcd7724" }
filmcraft-tts = { git = "https://github.com/jdfigura-montana/filmcraft", rev = "a9429d82d2e5b87539eb38926d5fc0f2ddcd7724" }
filmcraft-render = { git = "https://github.com/jdfigura-montana/filmcraft", rev = "a9429d82d2e5b87539eb38926d5fc0f2ddcd7724" }
filmcraft-audio-dsp = { git = "https://github.com/jdfigura-montana/filmcraft", rev = "a9429d82d2e5b87539eb38926d5fc0f2ddcd7724" }
filmcraft-codecs = { git = "https://github.com/jdfigura-montana/filmcraft", rev = "a9429d82d2e5b87539eb38926d5fc0f2ddcd7724" }
filmcraft-interchange = { git = "https://github.com/jdfigura-montana/filmcraft", rev = "a9429d82d2e5b87539eb38926d5fc0f2ddcd7724" }
filmcraft-platform = { git = "https://github.com/jdfigura-montana/filmcraft", rev = "a9429d82d2e5b87539eb38926d5fc0f2ddcd7724" }
filmcraft-engine = { git = "https://github.com/jdfigura-montana/filmcraft", rev = "a9429d82d2e5b87539eb38926d5fc0f2ddcd7724" }
filmcraft-export = { git = "https://github.com/jdfigura-montana/filmcraft", rev = "a9429d82d2e5b87539eb38926d5fc0f2ddcd7724" }
filmcraft-gpu = { git = "https://github.com/jdfigura-montana/filmcraft", rev = "a9429d82d2e5b87539eb38926d5fc0f2ddcd7724" }
filmcraft-scopes = { git = "https://github.com/jdfigura-montana/filmcraft", rev = "a9429d82d2e5b87539eb38926d5fc0f2ddcd7724" }

# Shared frontend components; keep this dependency above the engine boundary.
craft-ui = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "5c874d51eeb3de70e735c8ce87a59a7dedd47675", features = ["serde"] }
egui = "0.36"
eframe = { version = "0.36", default-features = false }
# Both variants enabled: line icons come from regular, transport glyphs from
# fill (the two share codepoints, so both fonts ship under distinct keys).
egui-phosphor = { version = "0.14.0", features = ["fill", "regular"] }
egui_kittest = "0.36"
rfd = "0.17"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
log = "0.4"
# All date/time conversion goes through chrono (no hand-rolled calendar code beyond the 400-year range extension; AGENTS.md).
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
# Win32 bindings for the crates allowed Windows-only code (dependency rule 5). The version matches
# the pins in capture, media-io and cutmark-hotkeys.
windows = "0.62.2"
# Window-handle lookup for the chrome install (S1 phase 7a); the same version eframe uses.
raw-window-handle = "0.6.2"
rayon = "1"
# Audio resampling, shared by the audio editor and the recorder.
rubato = "5.0.1"
# WAV reading and writing, shared by the audio editor and the recorder.
hound = "3.5.1"
uuid = { version = "1.29.0", features = ["v4", "v7", "serde"] }
thiserror = "2.0.21"
# Synchronous WebSocket server for the Recorder's local control API; no async runtime.
tungstenite = "0.30.0"
# Shared FFmpeg wrapper. Each crate picks the features it needs; the base entry
# enables none so consumers cannot drift apart on the version.
ffmpeg-next = { version = "9", default-features = false }

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# cpal 0.16 (video editor) and cpal 0.18 (audio editor) pull different alsa-sys versions that both link the native alsa library, and Cargo resolves for every platform. The suite is Windows only, so alsa is never built. Remove this patch and the patches folder when apps/video-editor moves to cpal 0.18.
[patch.crates-io]
alsa-sys = { path = "patches/alsa-sys" }

# Line tables keep file and line in panics and backtraces at a fraction of full debug info's size;
# dependencies need none.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

# Codec hot loops: debug-build tests (RFC/oracle vectors) are minutes slower below opt-level 3.
[profile.dev.package.craft-video]
opt-level = 3

[profile.dev.package.filmcraft-dng]
opt-level = 3

[profile.dev.package.craft-audio]
opt-level = 3

# Audio effects: realtime-factor tests and long convolution / spectral runs.
[profile.dev.package.filmcraft-audio-dsp]
opt-level = 3

[profile.dev.package.craft-media]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1