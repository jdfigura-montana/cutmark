[workspace]
resolver = "3"
members = ["apps/*", "crates/*"]
exclude = ["filmcraft"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "LicenseRef-Cutmark-Proprietary"

[workspace.dependencies]
# FilmCraft engine, pinned. Read-only upstream: never edited here. Names kept so engine imports
# do not change.
filmcraft-time = { git = "https://github.com/jdfigura-montana/filmcraft", rev = "30536bc5d0ddf690f2181b7b97182db8658a6038" }
filmcraft-geom = { git = "https://github.com/jdfigura-montana/filmcraft", rev = "30536bc5d0ddf690f2181b7b97182db8658a6038" }
filmcraft-color = { git = "https://github.com/jdfigura-montana/filmcraft", rev = "30536bc5d0ddf690f2181b7b97182db8658a6038" }
filmcraft-frame = { git = "https://github.com/jdfigura-montana/filmcraft", rev = "30536bc5d0ddf690f2181b7b97182db8658a6038" }
filmcraft-media = { git = "https://github.com/jdfigura-montana/filmcraft", rev = "30536bc5d0ddf690f2181b7b97182db8658a6038" }
filmcraft-project = { git = "https://github.com/jdfigura-montana/filmcraft", rev = "30536bc5d0ddf690f2181b7b97182db8658a6038" }
filmcraft-edit = { git = "https://github.com/jdfigura-montana/filmcraft", rev = "30536bc5d0ddf690f2181b7b97182db8658a6038" }
filmcraft-text = { git = "https://github.com/jdfigura-montana/filmcraft", rev = "30536bc5d0ddf690f2181b7b97182db8658a6038" }
filmcraft-tts = { git = "https://github.com/jdfigura-montana/filmcraft", rev = "30536bc5d0ddf690f2181b7b97182db8658a6038" }
filmcraft-render = { git = "https://github.com/jdfigura-montana/filmcraft", rev = "30536bc5d0ddf690f2181b7b97182db8658a6038" }
filmcraft-audio-dsp = { git = "https://github.com/jdfigura-montana/filmcraft", rev = "30536bc5d0ddf690f2181b7b97182db8658a6038" }
filmcraft-codecs = { git = "https://github.com/jdfigura-montana/filmcraft", rev = "30536bc5d0ddf690f2181b7b97182db8658a6038" }
filmcraft-interchange = { git = "https://github.com/jdfigura-montana/filmcraft", rev = "30536bc5d0ddf690f2181b7b97182db8658a6038" }
filmcraft-platform = { git = "https://github.com/jdfigura-montana/filmcraft", rev = "30536bc5d0ddf690f2181b7b97182db8658a6038" }
filmcraft-engine = { git = "https://github.com/jdfigura-montana/filmcraft", rev = "30536bc5d0ddf690f2181b7b97182db8658a6038" }
filmcraft-export = { git = "https://github.com/jdfigura-montana/filmcraft", rev = "30536bc5d0ddf690f2181b7b97182db8658a6038" }
filmcraft-gpu = { git = "https://github.com/jdfigura-montana/filmcraft", rev = "30536bc5d0ddf690f2181b7b97182db8658a6038" }
filmcraft-scopes = { git = "https://github.com/jdfigura-montana/filmcraft", rev = "30536bc5d0ddf690f2181b7b97182db8658a6038" }

# Shared frontend components; keep this dependency above the engine boundary.
craft-ui = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "5c874d51eeb3de70e735c8ce87a59a7dedd47675", features = ["serde"] }
egui = "0.36"
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
log = "0.4"
# All date/time conversion goes through chrono (no hand-rolled calendar code beyond the 400-year range extension; AGENTS.md).
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
rayon = "1"

# Line tables keep file and line in panics and backtraces at a fraction of full debug info's size;
# dependencies need none.
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

# Codec hot loops: debug-build tests (RFC/oracle vectors) are minutes slower below opt-level 3.
[profile.dev.package.filmcraft-h264]
opt-level = 3

[profile.dev.package.filmcraft-h264enc]
opt-level = 3

[profile.dev.package.filmcraft-hevc]
opt-level = 3

[profile.dev.package.filmcraft-prores]
opt-level = 3

[profile.dev.package.filmcraft-dnx]
opt-level = 3

[profile.dev.package.filmcraft-apv]
opt-level = 3

[profile.dev.package.filmcraft-dng]
opt-level = 3

[profile.dev.package.filmcraft-av1]
opt-level = 3

[profile.dev.package.filmcraft-aac]
opt-level = 3

[profile.dev.package.filmcraft-flac]
opt-level = 3

# Audio effects: realtime-factor tests and long convolution / spectral runs.
[profile.dev.package.filmcraft-audio-dsp]
opt-level = 3

[profile.dev.package.filmcraft-mxf]
opt-level = 3

[profile.dev.package.filmcraft-opus]
opt-level = 3

[profile.dev.package.filmcraft-vp8]
opt-level = 3

[profile.dev.package.filmcraft-vp9]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1