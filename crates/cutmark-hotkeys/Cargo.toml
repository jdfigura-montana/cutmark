[package]
name = "cutmark-hotkeys"
description = "Cutmark suite hotkey map: one shared chord file, per-app global hotkey registration, conflict and AltGr checks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# Strict lint set (S0 spec, Lints). Same as crates/marks except unsafe_code is "deny" instead of "forbid": the AltGr check calls Win32 keyboard APIs and carries one scoped allow, which forbid would reject.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[dependencies]
directories = "6.0.0"
global-hotkey = "0.10.0"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[dev-dependencies]
tempfile = "3.27.0"
