[package]
name = "ui-kit"
description = "Cutmark suite base dark theme: shared palette, fonts and egui style, so every app looks like the audio editor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# Strict lint set (S0 spec, Lints). Same as crates/cutmark-hotkeys, except unsafe_code is "deny":
# the appearance tests set CUTMARK_APPEARANCE_PATH (edition 2024 makes env::set_var unsafe) and the
# Win32 chrome in phase 7 needs it too. Each unsafe block carries #[allow(unsafe_code)] and a
# safety comment.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[dependencies]
eframe.workspace = true
egui.workspace = true
egui-phosphor.workspace = true
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
serde_json.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
serde_json.workspace = true
