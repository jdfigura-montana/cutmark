[package]
name = "studio-render"
description = "Cutmark Studio renderer: zoom and frame passes on wgpu, shared by the Studio preview and export."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# Strict lint set (S0 spec, Lints). Same as crates/events.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[dependencies]
ab_glyph = "0.2.32"
cursor-render = { version = "0.1.0", path = "../cursor-render" }
events = { version = "0.1.0", path = "../events" }
media-io = { version = "0.1.0", path = "../media-io" }
thiserror.workspace = true
wgpu = "30.0.1"
