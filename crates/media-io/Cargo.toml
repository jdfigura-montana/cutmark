[package]
name = "media-io"
description = "Cutmark suite media IO: hands the shared D3D11 device to FFmpeg for GPU frame pools and encoding."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# Strict lint set (S0 spec, Lints). Same as crates/capture.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[dependencies]
ffmpeg-next = { workspace = true, features = ["codec", "format"] }
log.workspace = true
serde = { workspace = true, features = ["derive"] }
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi_Common"] }

[dev-dependencies]
# Path dependency, used by the hwframes_probe example only.
capture = { path = "../capture" }
