[package]
name = "prompter-core"
description = "Cutmark Prompter core: the script model and Markdown parsing. No UI or OS dependencies."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# Strict lint set, same as crates/marks.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[dependencies]
pulldown-cmark = { version = "0.13.6", default-features = false }
serde.workspace = true
